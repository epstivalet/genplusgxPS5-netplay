name: Build Genesis Plus GX PS5 - Netplay Prototype

on:
  workflow_dispatch:
  push:
    branches: [main, feature/native-internet-p2p]
    paths:
      - '.github/workflows/build-genplus-netplay.yml'
      - 'GenesisPlusGXPS5-Netplay-v0.4-GitHub-Build/genplusgx-netplay-kit/**'

permissions:
  contents: read

env:
  KIT_DIR: GenesisPlusGXPS5-Netplay-v0.4-GitHub-Build/genplusgx-netplay-kit

jobs:
  build:
    name: Test and build netplay ELF
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout netplay project
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout pinned upstream emulator
        uses: actions/checkout@v4
        with:
          repository: MisterTemaki/genplusgxPS5
          ref: 154212f72704aa99989153626c1658783f35669f
          path: upstream
          persist-credentials: false

      - name: Verify uploaded project layout
        run: |
          test -f "$KIT_DIR/apply_to_upstream.py" || { echo "::error::Missing source integration script at $KIT_DIR"; exit 1; }
          test -f "$KIT_DIR/netplay/fe_netplay.cpp"
          test -f "$KIT_DIR/netplay/fe_netplay_tls.cpp"
          test -f "$KIT_DIR/netplay/fe_p2p_probe.cpp"
          test -f "$KIT_DIR/netplay/rendezvous.py"
          test -f "$KIT_DIR/tests/test_netplay.py"
          test -f upstream/ps5/Makefile

      - name: Install host and PS5 build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 g++ make python3 unzip wget curl zip zlib1g-dev

      - name: Install PS5 Payload SDK v0.44
        run: |
          curl -fL --retry 3 -o /tmp/ps5-payload-sdk.zip \
            https://github.com/ps5-payload-dev/sdk/releases/download/v0.44/ps5-payload-sdk.zip
          sudo unzip -q -o /tmp/ps5-payload-sdk.zip -d /opt
          test -x /opt/ps5-payload-sdk/bin/prospero-clang || { echo "::error::PS5 SDK layout differs from expected /opt/ps5-payload-sdk"; exit 1; }

      - name: Apply GN1 netplay frontend modifications
        run: python3 "$KIT_DIR/apply_to_upstream.py" upstream

      - name: Compile transport and run network tests
        run: |
          cd "$KIT_DIR"
          g++ -std=c++17 -Wall -Wextra -Werror -Inetplay netplay/fe_netplay.cpp tests/netplay_client_smoke.cpp -o tests/netplay_client_smoke
          g++ -std=c++17 -Wall -Wextra -Werror -Inetplay netplay/fe_p2p_probe.cpp tests/p2p_probe_smoke.cpp -o tests/p2p_probe_smoke
          python3 -m unittest discover -s tests -p 'test_netplay.py' -v

      - name: Compile host emulator
        env:
          PS5_PAYLOAD_SDK: /opt/ps5-payload-sdk
        run: make -C upstream/ps5 host -j2

      - name: Build native PS5 installer ELF
        env:
          PS5_PAYLOAD_SDK: /opt/ps5-payload-sdk
          LLD: ld.lld-18
        run: |
          make -C upstream/ps5 ps5 -j2
          test -s upstream/ps5/build/ps5/GenesisPlusGXPS5.elf

      - name: Upload experimental ELF
        uses: actions/upload-artifact@v4
        with:
          name: GenesisPlusGXPS5-Netplay-v0.6-Internet-Probe-EXPERIMENTAL-ELF
          path: upstream/ps5/build/ps5/GenesisPlusGXPS5.elf
          if-no-files-found: error
          retention-days: 14
